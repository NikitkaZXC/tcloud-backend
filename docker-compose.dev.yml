name: tcloud-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcloud}
      POSTGRES_USER: ${POSTGRES_USER:-tcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcloud}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tcloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tcloud}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  clamav:
    image: clamav/clamav:1.5.4-debian
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdb:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro

  app: &app
    profiles: [app]
    build: .
    restart: unless-stopped
    env_file: .env
    environment: &app-env
      POSTGRES_HOST: postgres
      CLAMAV_HOST: clamav
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      TELEGRAM_SESSION: /data/session/tcloud
      TELEGRAM_UPLOAD_SESSION: /data/session/tcloud-upload
      TELEGRAM_DOWNLOAD_SESSION: /data/session/tcloud-download
      JWT_PRIVATE_KEY_PATH: /certs/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /certs/jwt-public.pem
      UPLOAD_TMP_DIR: /data/tmp
      REDIS_PASSWORD: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - session:/data/session
      - tmp:/data/tmp
      - ./certs:/certs:ro
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-download:
    <<: *app
    ports: []
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command: ["celery", "--app=src.infrastructure.background.celery.app", "worker", "--pool=threads", "--concurrency=4", "--queues=uploads.download", "--hostname=download@%h", "--loglevel=INFO"]

  worker-prepare:
    <<: *app
    ports: []
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command: ["celery", "--app=src.infrastructure.background.celery.app", "worker", "--pool=threads", "--concurrency=4", "--queues=uploads.prepare", "--hostname=prepare@%h", "--loglevel=INFO"]

  worker-telegram:
    <<: *app
    ports: []
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command: ["celery", "--app=src.infrastructure.background.celery.app", "worker", "--pool=threads", "--concurrency=2", "--queues=uploads.telegram,archives.build", "--hostname=telegram@%h", "--loglevel=INFO"]

  flower:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app flower --port=5555 --basic-auth="$${FLOWER_USER:-tcloud}:$${FLOWER_PASSWORD:-tcloud}"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq: {condition: service_healthy}

volumes:
  pgdata:
  session:
  tmp:
  clamdb:
