# clamd для tcloud: TCP 3310; MaxFileSize — потолок libclamav (2 ГиБ − 3 байта), его же держит CLAMAV_MAX_FILE_SIZE
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
StreamMaxLength 4000M
MaxScanSize 4000M
MaxFileSize 2147483645
ReadTimeout 900
CommandReadTimeout 900
MaxScanTime 1800000
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
HeuristicAlerts yes
HeuristicScanPrecedence no
DetectPUA yes
AlertBrokenExecutables yes
AlertEncrypted yes
AlertOLE2Macros yes
