# clamd для tcloud: TCP 3310, потоки до 4000 МБ (лимит файла Telegram Premium)
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
StreamMaxLength 4000M
MaxScanSize 4000M
MaxFileSize 4000M
ReadTimeout 900
CommandReadTimeout 900
MaxScanTime 900000
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
HeuristicAlerts yes
HeuristicScanPrecedence no
DetectPUA yes
AlertBrokenExecutables yes
AlertEncrypted yes
AlertOLE2Macros yes
