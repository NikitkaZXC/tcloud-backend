name: tcloud

x-app: &app
  build: .
  image: tcloud:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: postgres
    CLAMAV_HOST: clamav
    RABBITMQ_HOST: rabbitmq
    REDIS_HOST: redis
  volumes:
    - session:/data/session
    - tmp:/data/tmp
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

x-worker-depends: &worker-depends
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      <<: *worker-depends
      clamav: {condition: service_started}

  worker-prepare:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app worker --pool=threads --concurrency="$${UPLOAD_PREPARE_CONCURRENCY:-4}" --queues=uploads.prepare --hostname=prepare@%h --loglevel=INFO
    depends_on:
      <<: *worker-depends
      app: {condition: service_started}
      clamav: {condition: service_started}

  worker-telegram:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app worker --pool=threads --concurrency="$${TELEGRAM_CONCURRENCY:-2}" --queues=uploads.telegram --hostname=telegram@%h --loglevel=INFO
    depends_on:
      <<: *worker-depends
      app: {condition: service_started}

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcloud}
      POSTGRES_USER: ${POSTGRES_USER:-tcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tcloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4-debian
    volumes:
      - clamdb:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  session:
  tmp:
  clamdb:
  rabbitmq:
  redis:
