name: tcloud

x-logging: &logging
  driver: json-file
  options: {max-size: 50m, max-file: "5"}

x-app: &app
  build: .
  image: ${TCLOUD_IMAGE:-tcloud:latest}
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: postgres
    CLAMAV_HOST: clamav
    RABBITMQ_HOST: rabbitmq
    REDIS_HOST: redis
    TELEGRAM_SESSION: /data/session/tcloud
    TELEGRAM_UPLOAD_SESSION: /data/session/tcloud-upload
    TELEGRAM_DOWNLOAD_SESSION: /data/session/tcloud-download
    JWT_PRIVATE_KEY_PATH: /certs/jwt-private.pem
    JWT_PUBLIC_KEY_PATH: /certs/jwt-public.pem
    UPLOAD_TMP_DIR: /data/tmp
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  volumes:
    - session:/data/session
    - tmp:/data/tmp
    - ./certs:/certs:ro
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  logging: *logging

x-worker-depends: &worker-depends
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      APP_DOCS_URL: ${APP_DOCS_URL:-}
      APP_REDOC_URL: ${APP_REDOC_URL:-}
      APP_OPENAPI_URL: ${APP_OPENAPI_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      <<: *worker-depends
      clamav: {condition: service_started}

  worker-download:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app worker --pool=threads --concurrency="$${UPLOAD_DOWNLOAD_CONCURRENCY:-4}" --queues=uploads.download --hostname=download@%h --loglevel=INFO
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    depends_on:
      <<: *worker-depends
      app: {condition: service_started}

  worker-prepare:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app worker --pool=threads --concurrency="$${UPLOAD_PREPARE_CONCURRENCY:-4}" --queues=uploads.prepare --hostname=prepare@%h --loglevel=INFO
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    depends_on:
      <<: *worker-depends
      app: {condition: service_started}
      clamav: {condition: service_started}

  worker-telegram:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - sh
      - -c
      - exec celery --app=src.infrastructure.background.celery.app worker --pool=threads --concurrency="$${TELEGRAM_CONCURRENCY:-2}" --queues=uploads.telegram,archives.build --hostname=telegram@%h --loglevel=INFO
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    depends_on:
      <<: *worker-depends
      app: {condition: service_started}

  flower:
    <<: *app
    env_file: []
    volumes: []
    environment:
      RUN_MIGRATIONS: "0"
      RABBITMQ_USER: ${RABBITMQ_USER:-tcloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      FLOWER_USER: ${FLOWER_USER:-tcloud}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:?set FLOWER_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec celery --broker="amqp://$${RABBITMQ_USER}:$${RABBITMQ_PASSWORD}@rabbitmq:5672//" flower --port=5555 --basic-auth="$${FLOWER_USER}:$${FLOWER_PASSWORD}"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq: {condition: service_healthy}

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcloud}
      POSTGRES_USER: ${POSTGRES_USER:-tcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tcloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  clamav:
    image: clamav/clamav:1.5.4-debian
    volumes:
      - clamdb:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  session:
  tmp:
  clamdb:
  rabbitmq:
  redis:
