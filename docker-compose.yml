services:
  app:
    build: .
    env_file: .env
    environment:
      TCLOUD_DATABASE_URL: postgresql+asyncpg://tcloud:${TCLOUD_DB_PASSWORD:-}@postgres:5432/tcloud
    ports:
      - "127.0.0.1:8000:8000"  # только локально
    volumes:
      - session:/data/session
      - tmp:/data/tmp
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
      clamav: {condition: service_started}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tcloud
      POSTGRES_PASSWORD: ${TCLOUD_DB_PASSWORD:-}
      POSTGRES_DB: tcloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcloud -d tcloud"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4-debian
    volumes:
      - clamdb:/var/lib/clamav
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
    restart: unless-stopped

  # docker compose --profile test run --rm tests
  tests:
    profiles: [test]
    build: {context: ., args: {DEV: "1"}}
    environment:
      TCLOUD_DATABASE_URL: postgresql+asyncpg://tcloud:tcloud@postgres-test:5432/tcloud
      TCLOUD_API_KEY: test
      TCLOUD_TG_API_ID: "1"
      TCLOUD_TG_API_HASH: test
    volumes:
      - .:/app
    command: python -m pytest -q
    depends_on:
      postgres-test: {condition: service_healthy}

  postgres-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tcloud
      POSTGRES_PASSWORD: tcloud
      POSTGRES_DB: tcloud
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcloud -d tcloud"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
  session:
  tmp:
  clamdb:
