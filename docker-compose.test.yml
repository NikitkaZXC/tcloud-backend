name: tcloud-test

services:
  tests:
    build:
      context: .
      args:
        UV_SYNC_ARGS: "--no-default-groups --group test"
    image: tcloud:test
    entrypoint: []
    command: ["pytest"]
    environment:
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: 5432
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tcloud_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tcloud_test"]
      interval: 2s
      timeout: 3s
      retries: 30
