name: tcloud-test

services:
  tests:
    build:
      context: .
      args:
        UV_SYNC_ARGS: "--no-default-groups --group test"
    image: tcloud:test
    entrypoint: []
    command: ["pytest"]
    environment:
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_REDIS_HOST: redis
      TEST_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    volumes:
      - ./tests:/app/tests:ro
      - ./docs:/app/docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tcloud_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tcloud_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30
